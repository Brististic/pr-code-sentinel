name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Dummy values so app.main imports cleanly without real secrets in CI.
      GITHUB_WEBHOOK_SECRET: ci_test_secret
      GITHUB_TOKEN: ""
      GEMINI_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest tests/ -v

      - name: Webhook smoke test
        run: python smoke_test_webhook.py